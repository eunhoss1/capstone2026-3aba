name: CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: 소스코드 체크아웃
        uses: actions/checkout@v4

      - name: Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker 이미지 빌드
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/git-practice:${{ github.sha }} .
          docker tag ${{ secrets.DOCKERHUB_USERNAME }}/git-practice:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/git-practice:latest

      - name: Docker Hub Push
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/git-practice:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/git-practice:latest